org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Project lives on D: while pub cache lives on C:; Kotlin incremental
# compilation cannot relativize paths across drive roots and crashes with
# "this and base files have different roots". Disable it.
kotlin.incremental=false

# 网络不佳时快速失败，避免单个依赖超时把整个构建拖到 36 分钟。
# 背景：本机直连 dl.google.com 是 10s 级超时，Gradle 默认的连接/读超时很长，
# 重试又多，于是 :jni 解析 androidx.exifinterface:1.4.1 时看起来像「卡死」。
# 仓库已在 settings.gradle.kts / build.gradle.kts 里换成阿里云镜像优先，
# 这三行是兜底：万一某个依赖只能走外网，也让它在 15s 内失败并重试 3 次，
# 而不是无限等待。
# 注意：systemProp.* 只在 Gradle 守护进程启动时读取，改完需要
#   cd android && gradlew.bat --stop
# 让旧守护进程退出，下一次构建才会生效。
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=15000
systemProp.org.gradle.internal.repository.max.retries=3
