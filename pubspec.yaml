name: work_photos
description: A photo management app with logical categorization (Android-first).
publish_to: 'none'
version: 1.3.1+20

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  photo_manager: ^3.1.0
  permission_handler: ^11.0.0
  share_plus: ^7.2.0
  pdf: ^3.10.0
  printing: ^5.11.0
  archive: ^3.4.0
  photo_view: ^0.14.0
  video_player: ^2.9.0
  go_router: ^13.0.0
  shared_preferences: ^2.2.0
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.16.0
  build_runner: ^2.4.0
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # 启用 gen-l10n：构建时按 l10n.yaml 生成 lib/l10n/generated/app_localizations.dart。
  generate: true
